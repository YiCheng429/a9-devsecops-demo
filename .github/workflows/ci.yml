name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can only read the repo
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + eslint-plugin-security)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high || true
